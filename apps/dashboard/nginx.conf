server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Angular owns the routing; every unknown path is a client-side route.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API, so the browser never needs CORS and no token crosses
  # an origin boundary.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Media Streams upgrade to a WebSocket on this path.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # A call turn can take a few seconds; the default 60s is fine but explicit.
    proxy_read_timeout 120s;
  }

  # Hashed bundles are immutable; index.html must never be cached or a deploy
  # leaves clients on stale JavaScript.
  location ~* \.(?:js|css|woff2?|png|svg|jpg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
